
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Meesho Online Shopping</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      background: #f8f8f8;
    }

    header {
      background: white;
      padding: 18px 6%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 15px;
      box-shadow: 0 2px 5px #ddd;
    }

    .logo {
      color: #9f2089;
      font-size: 32px;
      font-weight: bold;
    }

    .search {
      padding: 12px;
      width: 40%;
      min-width: 200px;
      border: 1px solid #aaa;
      border-radius: 5px;
    }

    header a {
      text-decoration: none;
      color: #333;
      font-weight: bold;
    }

    nav {
      background: white;
      display: flex;
      justify-content: center;
      gap: 30px;
      padding: 15px;
      flex-wrap: wrap;
    }

    nav a {
      color: #444;
      text-decoration: none;
    }

    .banner {
      margin: 25px auto;
      width: 90%;
      padding: 45px 20px;
      background: #f5d9ef;
      text-align: center;
      border-radius: 10px;
    }

    .banner h1 {
      color: #9f2089;
      font-size: 32px;
      margin-bottom: 12px;
    }

    .banner p {
      margin-bottom: 18px;
    }

    .banner button, .product button {
      background: #9f2089;
      color: white;
      border: none;
      padding: 10px 18px;
      border-radius: 5px;
      cursor: pointer;
    }

    h2 {
      text-align: center;
      margin: 30px 0 20px;
    }

    .products {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 20px;
      padding: 20px 5%;
    }

    .product {
      background: white;
      border-radius: 8px;
      overflow: hidden;
      text-align: center;
      padding-bottom: 18px;
      box-shadow: 0 2px 8px #ddd;
    }

    .product img {
      width: 100%;
      height: 220px;
      object-fit: cover;
    }

    .product h3 {
      margin: 12px 5px;
      font-size: 17px;
    }

    .price {
      color: #16833c;
      font-size: 20px;
      font-weight: bold;
      margin: 10px;
    }

    .product button {
      margin-top: 8px;
    }

    footer {
      background: #333;
      color: white;
      text-align: center;
      padding: 25px;
      margin-top: 30px;
    }

    @media (max-width: 600px) {
      header {
        justify-content: center;
      }

      .search {
        width: 100%;
      }

      .banner h1 {
        font-size: 25px;
      }
    }
  </style>
</head>
<body>

  <header>
    <div class="logo">meesho</div>
    <input class="search" id="search"
      type="text" placeholder="Search for products..."
      oninput="searchProducts()">
    <a href="#products">🛒 Shop Now</a>
  </header>

  <nav>
    <a href="#products">All Products</a>
    <a href="#products">Women</a>
    <a href="#products">Men</a>
    <a href="#products">Kids</a>
    <a href="#products">Home & Kitchen</a>
  </nav>

  <section class="banner">
    <h1>Big Shopping Sale!</h1>
    <p>Discover fashion, lifestyle and home essentials.</p>
    <button onclick="document.getElementById('products')
      .scrollIntoView({behavior:'smooth'})">
      Shop Now
    </button>
  </section>

  <h2>Popular Products</h2>

  <section class="products" id="products">

    <div class="product">
      <img src="https://images.unsplash.com/photo-1483985988355-763728e1935b?w=500"
        alt="Women's fashion">
      <h3>Women's Fashion</h3>
      <p class="price">₹399</p>
      <button onclick="addToCart('Women’s Fashion',399)">
        Add to Cart
      </button>
    </div>

    <div class="product">
      <img src="https://images.unsplash.com/photo-1521572163474-6864f9cf17ab?w=500"
        alt="Casual T-shirt">
      <h3>Casual T-Shirt</h3>
      <p class="price">₹249</p>
      <button onclick="addToCart('Casual T-Shirt',249)">
        Add to Cart
      </button>
    </div>

    <div class="product">
      <img src="https://images.unsplash.com/photo-1542291026-7eec264c27ff?w=500"
        alt="Sports shoes">
      <h3>Sports Shoes</h3>
      <p class="price">₹599</p>
      <button onclick="addToCart('Sports Shoes',599)">
        Add to Cart
      </button>
    </div>

    <div class="product">
      <img src="https://images.unsplash.com/photo-1584917865442-de89df76afd3?w=500"
        alt="Fashion handbag">
      <h3>Fashion Handbag</h3>
      <p class="price">₹349</p>
      <button onclick="addToCart('Fashion Handbag',349)">
        Add to Cart
      </button>
    </div>

  </section>

  <footer>
    <p>Meesho Shopping Demo</p>
    <p>© 2026 Online Shopping Website</p>
  </footer>

  <script>
    let cart = [];

    function addToCart(name, price) {
      cart.push({ name, price });
      alert(name + " added to cart!\nCart items: " + cart.length);
    }

    function searchProducts() {
      const query = document.getElementById("search")
        .value.toLowerCase();

      document.querySelectorAll(".product").forEach(product => {
        product.style.display =
          product.innerText.toLowerCase().includes(query)
            ? "" : "none";
      });
    }
  </script>

</body>
</html>
